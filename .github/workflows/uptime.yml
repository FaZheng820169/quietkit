name: Uptime check

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check every URL in the live sitemap
        run: |
          set -e
          SITEMAP="https://fazheng820169.github.io/quietkit/sitemap.xml"
          mapfile -t urls < <(curl -sL --max-time 20 "$SITEMAP" | grep -o '<loc>[^<]*</loc>' | sed 's/<loc>//;s|</loc>||')
          echo "sitemap lists ${#urls[@]} URLs"
          if [ "${#urls[@]}" -lt 10 ]; then
            echo "::error::sitemap returned ${#urls[@]} URLs, expected at least 10"
            exit 1
          fi
          for url in "${urls[@]}"; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 "$url")
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url returned $code"
              exit 1
            fi
          done

      - name: Open an issue when the site is down
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Uptime check failed $(date -u +%Y-%m-%d)" \
            --body "The scheduled uptime check could not reach the site. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
